# Better Experience - Access Transformer
# Vanilla OptionInstance$ValueSet and OptionInstance$SliderableValueSet are package-private
# in net.minecraft.client, so a class in any other package cannot implement them. Widening the
# brightness (gamma) range to 0.0-10.0 needs a custom SliderableValueSet, hence this AT.
# ValueSet is widened as well: it appears in the public OptionInstance constructor signature
# and is the supertype of SliderableValueSet.
# NOTE: keep this file ASCII-only and never leave a line containing just "#" - a bare "#" is
# parsed as an empty transform rule and makes the AT processor fail with
# "Invalid access transformer line", which aborts the build.
public net.minecraft.client.OptionInstance$ValueSet
public net.minecraft.client.OptionInstance$SliderableValueSet
